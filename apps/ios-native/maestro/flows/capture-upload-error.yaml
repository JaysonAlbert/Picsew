appId: top.ibotcloud.picsew.native
name: Capture upload error state
tags:
  - screenshots
---
- launchApp:
    clearState: true
    arguments:
      picsewAutomationScenario: uploadError
- waitForAnimationToEnd
- assertVisible:
    id: "shell.route.upload"
- assertVisible:
    id: "upload.errorMessage"
- takeScreenshot:
    path: capture-upload-error
    label: Capture the upload error state
