appId: top.ibotcloud.picsew.native
name: Capture onboarding shell
tags:
  - screenshots
---
- launchApp:
    clearState: true
    arguments:
      picsewAutomationScenario: onboarding
- waitForAnimationToEnd
- assertVisible:
    id: "onboarding.screen"
- assertVisible:
    id: "onboarding.continue"
- takeScreenshot:
    path: artifacts/minimal-onboarding
    label: Capture the onboarding screen
