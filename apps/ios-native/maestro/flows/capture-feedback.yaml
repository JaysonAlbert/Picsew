appId: top.ibotcloud.picsew.native
name: Capture feedback shell
tags:
  - screenshots
---
- launchApp:
    clearState: true
    arguments:
      picsewAutomationScenario: feedback
- waitForAnimationToEnd
- assertVisible:
    id: "shell.route.feedback"
- assertVisible:
    id: "feedback.placeholder"
- assertVisible:
    id: "feedback.send"
- assertVisible:
    id: "feedback.message"
- assertVisible:
    id: "feedback.saveDraft"
    enabled: false
- takeScreenshot:
    path: artifacts/minimal-feedback
    label: Capture the feedback screen
