appId: top.ibotcloud.picsew.native
name: Capture upload empty shell
tags:
  - screenshots
---
- launchApp:
    clearState: true
    arguments:
      picsewAutomationScenario: uploadEmpty
- waitForAnimationToEnd
- assertVisible:
    id: "shell.route.upload"
- assertVisible:
    id: "upload.stage.import"
- assertVisible: "Start Processing"
- takeScreenshot:
    path: capture-upload-empty
    label: Capture the upload empty state
